<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clattertrap</title>
<style>
  body { margin: 0; background: #e9e2d3; color: #2b2b2b; font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font: bold 22px Georgia, "Times New Roman", serif; margin: 0 0 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .runs { flex-basis: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  select, button, label { font: inherit; padding: 4px 10px; }
  label { margin-left: auto; }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #f6f1e7; border: 1px solid #b9ad97; }
  .caption { font-style: italic; margin: 8px 0 0; min-height: 1.4em; }
  .status { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #4a4a4a; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
