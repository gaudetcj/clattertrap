[workspace]
resolver = "3"
members = ["crates/clattertrap-core", "crates/clattertrap-cli", "crates/clattertrap-wasm", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
clattertrap-core = { path = "crates/clattertrap-core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
insta = "1"
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
