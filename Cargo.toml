[workspace]
resolver = "3"
members = ["crates/clattertrap-core", "crates/clattertrap-cli", "crates/clattertrap-wasm", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
clattertrap-core = { path = "crates/clattertrap-core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", default-features = false }
insta = "1"
libm = "0.2"
proptest = "1"
rapier2d = { version = "=0.36.1", features = ["enhanced-determinism"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
